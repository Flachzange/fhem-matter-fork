name: FHEM Matter Perl regression tests

on:
  push:
    paths:
      - 'FHEM/**'
      - 't/**'
      - '.github/workflows/perl-tests.yml'
  pull_request:
    paths:
      - 'FHEM/**'
      - 't/**'
      - '.github/workflows/perl-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perl-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Perl JSON dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libjson-perl
      - name: Run FHEM callback and WebSocket regression tests
        run: prove -v t/matter_node_sync.t
